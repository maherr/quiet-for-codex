name: Quiet CI

on:
  pull_request:
  push:
    branches:
      - main
      - "tui/quiet-*"
  workflow_dispatch:
    inputs:
      refresh_snapshots:
        description: Generate a reviewed TUI snapshot patch without pushing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: quiet-ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.refresh_snapshots && 'snapshot-refresh' || 'checks' }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  snapshot-refresh:
    name: Generate TUI snapshot patch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Regenerate snapshots
        working-directory: codex-rs
        run: |
          INSTA_UPDATE=always cargo test --locked \
            --target x86_64-unknown-linux-gnu \
            -p codex-tui --lib -- --test-threads=1
      - name: Package source-bound patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tracked < <(git diff --name-only --no-renames -z)
          mapfile -d '' untracked < <(git ls-files --others --exclude-standard -z)
          changed=("${tracked[@]}" "${untracked[@]}")
          for path in "${changed[@]}"; do
            case "$path" in
              codex-rs/*/snapshots/*.snap) ;;
              *)
                echo "Snapshot refresh changed a forbidden path: $path" >&2
                exit 1
                ;;
            esac
          done
          if [[ "${#untracked[@]}" -gt 0 ]]; then
            git add -N -- "${untracked[@]}"
          fi
          mkdir -p snapshot-refresh
          git diff --binary -- codex-rs > snapshot-refresh/snapshots.patch
          printf '%s\n' "$GITHUB_SHA" > snapshot-refresh/source-sha.txt
          if [[ "${#changed[@]}" -gt 0 ]]; then
            printf '%s\n' "${changed[@]}" > snapshot-refresh/changed-paths.txt
          else
            : > snapshot-refresh/changed-paths.txt
          fi
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: quiet-snapshot-refresh-${{ github.sha }}
          path: snapshot-refresh
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Format, packaging, and TUI tests
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
          targets: x86_64-unknown-linux-gnu
      # Candidate checks only. The release workflow is deliberately left
      # uncached: a release artifact must be built from source on a clean
      # runner, so a poisoned cache cannot reach a published binary, and the
      # release re-runs these same tests uncached before publishing.
      # `prefix-key` evicts the entry poisoned on 2026-08-05. `cache-all-crates` keeps the
      # v8 crate's build-script OUTPUT in the cache, which is the actual defect: the pinned
      # rusty_v8 download is a .gz, and the crate's build script is what extracts it into
      # librusty_v8.a. A full-match cache restore made Cargo treat v8 as fresh, so the script
      # never ran, nothing extracted the archive, and the link failed with "could not find
      # native static library `rusty_v8`" ~12s after the artifact step reported success. The key
      # is Cargo.lock-based rather than per-branch, which is why main, the staging branch and a
      # dependabot branch all failed identically from one poisoned entry.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: codex-rs
          prefix-key: v1-rust
          cache-all-crates: "true"
      - name: Check Rust formatting
        run: python3 scripts/ci/check_quiet_rustfmt.py
      - name: Test release tooling
        run: |
          set -euo pipefail
          python3 scripts/ci/check_embedded_skill_identity.py
          python3 scripts/codex_package/test_ripgrep.py
          python3 scripts/release/test_generate_v8_notices.py
          python3 scripts/release/test_prepare_v8_artifacts.py
          python3 scripts/release/test_archive_release_symbols.py
          python3 scripts/release/test_finalize_quiet_package.py
          python3 scripts/release/test_smoke_quiet_package.py
          python3 scripts/release/test_watch_workflow_run.py
          python3 scripts/release/test_install_sh.py
          python3 scripts/release/test_release_workflow.py
          python3 -m py_compile \
            scripts/ci/check_embedded_skill_identity.py \
            scripts/ci/check_quiet_rustfmt.py \
            scripts/codex_package/test_ripgrep.py \
            scripts/release/finalize_quiet_package.py \
            scripts/release/generate_v8_notices.py \
            scripts/release/prepare_v8_artifacts.py \
            scripts/release/test_archive_release_symbols.py \
            scripts/release/smoke_quiet_package.py \
            scripts/release/test_generate_v8_notices.py \
            scripts/release/test_prepare_v8_artifacts.py \
            scripts/release/test_smoke_quiet_package.py \
            scripts/release/watch_workflow_run.py \
            scripts/release/test_watch_workflow_run.py \
            scripts/release/test_install_sh.py \
            scripts/release/test_release_workflow.py
          sh -n scripts/release/install.sh
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Run TUI library tests
        working-directory: codex-rs
        run: cargo test --locked --target x86_64-unknown-linux-gnu -p codex-tui --lib -- --test-threads=1
      - name: Run hook lifecycle regressions
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-app-server-client --lib \
            event_requires_delivery_marks_transcript_and_terminal_events
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-app-server-client --lib \
            forward_in_process_event_preserves_transcript_notifications_under_backpressure
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-app-server-client --lib \
            remote_backpressure_preserves_transcript_notifications
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-app-server --lib \
            guaranteed_delivery_helpers_cover_terminal_server_notifications
      - name: Run privacy, identity, and hidden-command regressions
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-feedback --lib \
            quiet_feedback_uploads_are_disabled
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-app-server --lib \
            quiet_feedback_upload_api_stays_disabled
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-tui --lib \
            feedback_command_reports_uploads_disabled
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-tui --lib \
            quiet_commands_are_hidden_from_command_popup
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-exec --lib \
            exec_summary_uses_quiet_identity_and_exact_build_version
      - name: Run fork-safety CLI tests
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-cli --bin codex \
            quiet_build_does_not_register_desktop_app_subcommand
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-cli --bin codex \
            release_list_includes_prerelease_channel
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-cli --test update
      - name: Black-box daemon safety routes
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked --target x86_64-unknown-linux-gnu \
            -p codex-cli --bin codex
          quiet="target/x86_64-unknown-linux-gnu/debug/codex"
          disabled_message="daemon-managed app-server routes are disabled in Quiet for Codex because the upstream implementation installs and updates stock Codex"
          routes=(
            "app-server daemon bootstrap"
            "app-server daemon start"
            "app-server daemon stop"
            "app-server daemon restart"
            "app-server daemon enable-remote-control"
            "app-server daemon disable-remote-control"
            "app-server daemon pid-update-loop"
            "app-server daemon version"
            "remote-control"
            "remote-control start"
            "remote-control stop"
            "remote-control pair"
          )
          export CODEX_HOME="$RUNNER_TEMP/quiet-daemon-safety-codex-home"
          mkdir -p "$CODEX_HOME"
          for route in "${routes[@]}"; do
            read -r -a route_args <<< "$route"
            set +e
            output="$("$quiet" "${route_args[@]}" 2>&1)"
            status=$?
            set -e
            if (( status == 0 )); then
              echo "Disabled route unexpectedly succeeded: $route" >&2
              exit 1
            fi
            if [[ "$output" != *"$disabled_message"* ]]; then
              echo "Disabled route did not return the Quiet safety error: $route" >&2
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done
      - name: Run missing-zsh fallback test
        working-directory: codex-rs
        run: |
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-core \
            session_new_falls_back_when_zsh_fork_enabled_without_packaged_zsh
      - name: Run login fork-safety tests
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-login \
            streamlined_success_page_does_not_handoff_to_the_stock_desktop_app
          cargo test --locked --target x86_64-unknown-linux-gnu \
            -p codex-app-server --test all \
            login_account_chatgpt_ignores_stock_desktop_success_page_request

  linux-candidate:
    name: Build hosted Linux candidate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/tui/quiet-')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Resolve candidate identity
        shell: bash
        run: |
          set -euo pipefail
          quiet_version="$(tr -d '[:space:]' < QUIET_VERSION)"
          codex_base="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test -n "$quiet_version"
          test -n "$codex_base"
          {
            echo "CODEX_QUIET_VERSION=$quiet_version"
            echo "CODEX_BASE_VERSION=$codex_base"
            echo "CODEX_QUIET_DISPLAY_VERSION=codex-quiet $quiet_version (codex $codex_base)"
          } >> "$GITHUB_ENV"
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl build tools
        shell: bash
        env:
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          APT_INSTALL_ARGS: --no-install-recommends
        run: bash .github/scripts/install-musl-build-tools.sh
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl
      - name: Build and hash bundled bubblewrap
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" --bin bwrap
          bwrap="$CARGO_TARGET_DIR/$TARGET/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap"
          digest="$(sha256sum "$bwrap" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"
          echo "QUIET_BWRAP_BIN=$bwrap" >> "$GITHUB_ENV"
      - name: Build, identify, and archive candidate
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/quiet-candidate-package"
          mkdir -p candidate-dist
          archive="candidate-dist/codex-quiet-candidate-$GITHUB_SHA-$TARGET.tar.gz"
          symbols_archive="candidate-dist/codex-symbols-candidate-$GITHUB_SHA-$TARGET.tar.gz"
          python3 scripts/build_codex_package.py \
            --target "$TARGET" \
            --cargo-profile release \
            --package-dir "$package_dir" \
            --archive-output "$archive" \
            --zsh-manifest scripts/release/no-zsh.json \
            --bwrap-bin "$QUIET_BWRAP_BIN" \
            --force
          bash .github/scripts/archive-release-symbols-and-strip-binaries.sh \
            --target "$TARGET" \
            --artifact-name "candidate-$GITHUB_SHA-$TARGET" \
            --release-dir "$CARGO_TARGET_DIR/$TARGET/release" \
            --archive-dir candidate-dist \
            --binaries "codex codex-code-mode-host"
          test -s "$symbols_archive"
          expected="codex-quiet $CODEX_QUIET_VERSION"
          actual="$("$package_dir/bin/codex" --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Candidate identity mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi
          python3 - "$package_dir/codex-package.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "entrypoint": "bin/codex",
              "target": os.environ["TARGET"],
              "version": os.environ["CODEX_BASE_VERSION"],
          }
          actual = {key: metadata.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(
                  f"Candidate package metadata mismatch: expected {expected!r}, "
                  f"got {actual!r}"
              )
          PY
          printf '%s\n' "$GITHUB_SHA" > candidate-dist/source-sha.txt
          python3 - candidate-dist/candidate-identity.json <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          identity = {
              "quietVersion": os.environ["CODEX_QUIET_VERSION"],
              "sourceSha": os.environ["GITHUB_SHA"],
              "target": os.environ["TARGET"],
              "upstreamVersion": os.environ["CODEX_BASE_VERSION"],
          }
          Path(sys.argv[1]).write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd candidate-dist
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
            sha256sum "$(basename "$symbols_archive")" \
              > "$(basename "$symbols_archive").sha256"
          )
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: quiet-linux-candidate-${{ github.sha }}
          path: candidate-dist
          if-no-files-found: error
          retention-days: 7

  linux-symbols-arm64:
    name: Check aarch64 Linux symbol sidecars
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_snapshots }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Exercise the Linux symbol archiver on arm64
        run: python3 scripts/release/test_archive_release_symbols.py

  windows-symbols-arm64:
    name: Check aarch64 Windows symbol sidecars
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_snapshots }}
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-pc-windows-msvc
      - name: Configure MSVC
        uses: ./.github/actions/setup-msvc-env
        with:
          target: aarch64-pc-windows-msvc
      - name: Exercise Cargo PDB naming and the symbol archiver on arm64
        shell: pwsh
        run: python scripts/release/test_archive_release_symbols.py

  platform-check:
    name: Check ${{ matrix.target }}
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_snapshots }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      # Candidate checks only; see the note in the quality job. These are the
      # slowest runners, so they benefit most.
      # `prefix-key` evicts the entry poisoned on 2026-08-05. `cache-all-crates` keeps the
      # v8 crate's build-script OUTPUT in the cache, which is the actual defect: the pinned
      # rusty_v8 download is a .gz, and the crate's build script is what extracts it into
      # librusty_v8.a. A full-match cache restore made Cargo treat v8 as fresh, so the script
      # never ran, nothing extracted the archive, and the link failed with "could not find
      # native static library `rusty_v8`" ~12s after the artifact step reported success. The key
      # is Cargo.lock-based rather than per-branch, which is why main, the staging branch and a
      # dependabot branch all failed identically from one poisoned entry.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: codex-rs
          key: ${{ matrix.target }}
          prefix-key: v1-rust
          cache-all-crates: "true"
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Check main and code-mode host binaries
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          cargo check --locked --release --target "${{ matrix.target }}" \
            --bin codex \
            --bin codex-code-mode-host
      - name: Test macOS command-popup snapshot
        if: runner.os == 'macOS'
        shell: bash
        working-directory: codex-rs
        run: |
          cargo test --locked --target "${{ matrix.target }}" \
            -p codex-tui --lib \
            default_command_popup_items_snapshot
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @("scripts/release/install.ps1", "scripts/release/test_install_ps1.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              exit 1
            }
          }
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/test_install_ps1.ps1
      - name: Test installer in Windows PowerShell 5.1
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $legacy = Get-Command powershell.exe -ErrorAction SilentlyContinue
          if ($null -eq $legacy) {
            throw "Windows PowerShell 5.1 is unavailable on this runner."
          }
          & $legacy.Source -NoProfile -ExecutionPolicy Bypass -File scripts/release/test_install_ps1.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell 5.1 installer smoke failed."
          }
